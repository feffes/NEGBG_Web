name: Content from issue

# Turns the "New tournament" and "News post" issue forms into a pull request.
# Every edit of the issue rebuilds the content from master and force-updates the
# same PR branch (issue-form/<number>), so the issue is the single source of truth.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

# A quick double edit should not race two runs against the same branch.
concurrency:
  group: content-from-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    # The repo is public and the issue templates apply their own labels, so gate on
    # membership: only people who can already push should be able to open branches.
    # Closed issues are skipped so editing one after its PR merged does nothing.
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'new-tournament') ||
       contains(github.event.issue.labels.*.name, 'news-post')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Pick form
        id: form
        run: |
          if [[ "${{ contains(github.event.issue.labels.*.name, 'new-tournament') }}" == "true" ]]; then
            echo "type=new-tournament" >> "$GITHUB_OUTPUT"
          else
            echo "type=news-post" >> "$GITHUB_OUTPUT"
          fi

      - uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
        id: parse
        with:
          template-path: .github/ISSUE_TEMPLATE/${{ steps.form.outputs.type }}.yml

      - name: Build content
        id: build
        env:
          ISSUE_JSON: ${{ steps.parse.outputs.jsonString }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FORM_TYPE: ${{ steps.form.outputs.type }}
        run: node .github/scripts/build-content.mjs "$FORM_TYPE"

      - name: Open or update pull request
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: ${{ steps.build.outputs.branch }}
          base: master
          title: ${{ steps.build.outputs.title }}
          commit-message: |
            ${{ steps.build.outputs.title }}

            Från #${{ github.event.issue.number }}.
          author: ${{ github.event.issue.user.login }} <${{ github.event.issue.user.id }}+${{ github.event.issue.user.login }}@users.noreply.github.com>
          body: |
            ${{ steps.build.outputs.summary }}

            Skapad från #${{ github.event.issue.number }} av @${{ github.event.issue.user.login }}.
            För att ändra något: redigera issuet, så uppdateras den här pull requesten.

            Closes #${{ github.event.issue.number }}
          delete-branch: true

      - name: Link the pull request from the issue
        if: steps.pr.outputs.pull-request-operation == 'created'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Tack! Jag har skapat ${process.env.PR_URL} åt dig.`,
                '',
                'Kolla igenom förhandsvisningen som Cloudflare lägger som en kommentar där. Ser det bra ut kan någon merga den, och då går den live.',
                '',
                'Behöver du ändra något: **redigera det här issuet**, så uppdaterar sig pull requesten själv.',
              ].join('\n'),
            })

      - name: Explain what went wrong
        # Any failed step, not only a form mistake, so nothing fails silently.
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          BUILD_ERROR: ${{ steps.build.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Jag kunde inte skapa posten:',
                '',
                `> ${(process.env.BUILD_ERROR || 'Something went wrong on our side, not in your form.').split('\n').join('\n> ')}`,
                '',
                `Redigera issuet så försöker jag igen automatiskt. ([Körningen](${process.env.RUN_URL}))`,
              ].join('\n'),
            })
